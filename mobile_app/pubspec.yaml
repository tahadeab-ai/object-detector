name: object_detector
description: "Production Real-Time Object Detection & Multi-Object Tracking Cockpit"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  ffi: ^2.1.2
  path_provider: ^2.1.2
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "../branding/icon.png"
  adaptive_icon_background: "../branding/icon_background.png"
  adaptive_icon_foreground: "../branding/icon_foreground.png"
  adaptive_icon_monochrome: "../branding/icon_monochrome.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0B0F14"
  image: "../branding/icon_foreground.png"
  android: true
  ios: false
  android_12:
    color: "#0B0F14"
    image: "../branding/icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/samples/
