version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: yolo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

  telemetry_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yolo_telemetry_service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - REDIS_ADDR=redis:6379
      - PORT=8080
    depends_on:
      - redis

volumes:
  redis_data:
