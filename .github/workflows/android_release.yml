name: Android Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64-apk:
    name: Build & Sign arm64-v8a APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: 'stable'
          cache: true

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: 'aarch64-linux-android'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: 'r28'
          link-to-sdk: true

      - name: Decode Release Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile_app/android/app/release.keystore
          cat <<EOF > mobile_app/android/key.properties
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.keystore
          EOF

      - name: Run Host Quality Gates
        run: |
          cd native_core/rust
          cargo test -p yolo_core
          cd ../../mobile_app
          flutter analyze
          flutter test

      - name: Cross-Compile Rust Core for Android arm64-v8a
        run: |
          cd native_core/rust
          cargo build --release -p yolo_ffi --target aarch64-linux-android

      - name: Build Release APK (arm64-v8a strictly)
        run: |
          cd mobile_app
          flutter build apk --release --target-platform android-arm64

      - name: Verify APK Architecture & Symbols
        run: |
          APK_PATH="mobile_app/build/app/outputs/flutter-apk/app-release.apk"
          unzip -l "$APK_PATH" | grep -E "lib/arm64-v8a/libyolo_ncnn.so"
          unzip -l "$APK_PATH" | grep -E "lib/arm64-v8a/libc\+\+_shared.so"
          # Verify zero x86_64 or armeabi-v7a
          ! unzip -l "$APK_PATH" | grep -E "lib/x86_64/|lib/armeabi-v7a/"

      - name: Rename Release Artifact
        run: |
          mv mobile_app/build/app/outputs/flutter-apk/app-release.apk object-detector-v1.0.0-arm64-v8a.apk
          sha256sum object-detector-v1.0.0-arm64-v8a.apk > object-detector-v1.0.0-arm64-v8a.apk.sha256

      - name: Publish GitHub Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            object-detector-v1.0.0-arm64-v8a.apk
            object-detector-v1.0.0-arm64-v8a.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
