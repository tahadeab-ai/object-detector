name: Android Release Build & Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64-apk:
    name: Build & Publish YOLO11 NCNN arm64-v8a APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download & Extract Full Nihui NCNN YOLO11 Model Assets
        run: |
          mkdir -p /tmp/nihui_assets
          curl -L -o /tmp/nihui.apk https://github.com/nihui/ncnn-android-yolo11/releases/download/20261020/ncnn-android-yolo11-20261020.5f73d53.apk
          unzip -o -j /tmp/nihui.apk "assets/*.bin" "assets/*.param" -d mobile_app/android/app/src/main/assets/
          ls -lh mobile_app/android/app/src/main/assets/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies & Run Static Analysis
        working-directory: mobile_app
        run: |
          flutter pub get
          flutter analyze --no-pub

      - name: Build Release APK (arm64-v8a)
        working-directory: mobile_app
        run: |
          flutter build apk --release --target-platform android-arm64

      - name: Prepare Release Artifacts
        run: |
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk YOLO-NCNN-Detector-arm64-v8a.apk
          sha256sum YOLO-NCNN-Detector-arm64-v8a.apk > YOLO-NCNN-Detector-arm64-v8a.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOLO-NCNN-Detector-arm64-v8a
          path: YOLO-NCNN-Detector-arm64-v8a.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.0' }}
          draft: false
          prerelease: false
          files: |
            YOLO-NCNN-Detector-arm64-v8a.apk
            YOLO-NCNN-Detector-arm64-v8a.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
